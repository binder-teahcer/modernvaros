<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A 20. század eleji fejlődő város – Interaktív tabló</title>
  <style>
    :root {
      --bg-paper: #f3ead8;
      --bg-panel: #fbf6eb;
      --ink-dark: #2b2118;
      --ink-muted: #645342;
      --accent-gold: #c68b2c;
      --accent-blue: #2d5f7e;
      --accent-green: #2e7d4f;
      --accent-red: #b9382c;
      --border-vintage: #cbb99a;
      --shadow-soft: 0 4px 12px rgba(43, 33, 24, 0.11);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #f8f1e3 0%, #e7dac2 100%);
      color: var(--ink-dark);
      font-family: "Segoe UI", "Trebuchet MS", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      padding: 4px 5px;
      gap: 4px;
    }

    /* Ultra-Compact Header */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--bg-panel);
      border: 1.5px solid var(--border-vintage);
      border-radius: 9px;
      padding: 4px 10px;
      box-shadow: var(--shadow-soft);
    }

    .title-block {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
    }

    .title-block h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(0.95rem, 1.35vw, 1.2rem);
      color: var(--ink-dark);
    }

    .subtitle {
      font-size: clamp(0.72rem, 0.9vw, 0.82rem);
      color: var(--ink-muted);
    }

    .hud {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .active-prompt {
      background: #fff7e2;
      border: 1.5px solid var(--accent-gold);
      border-radius: 7px;
      padding: 3px 9px;
      font-size: clamp(0.78rem, 0.98vw, 0.88rem);
      font-weight: 600;
      color: #5b3c0b;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .active-prompt span.target-name {
      color: var(--accent-blue);
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .lives-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #fff;
      border: 1.5px solid var(--border-vintage);
      border-radius: 7px;
      padding: 3px 8px;
      font-weight: 700;
      font-size: 0.82rem;
    }

    .hearts {
      display: flex;
      gap: 2px;
      align-items: center;
    }

    .heart {
      width: 18px;
      height: 18px;
      transition: transform 0.3s ease, opacity 0.3s ease, filter 0.3s ease;
    }

    .heart.lost {
      opacity: 0.22;
      filter: grayscale(1);
      transform: scale(0.8);
    }

    .progress-pill {
      background: #edf5ef;
      border: 1.5px solid #a9cfb6;
      color: #1f5c39;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 7px;
      font-size: 0.82rem;
    }

    .btn-icon {
      appearance: none;
      border: 1.5px solid var(--border-vintage);
      background: #fff;
      color: var(--ink-dark);
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-icon:hover {
      background: #f5ebd8;
    }

    .btn-icon:active {
      transform: scale(0.97);
    }

    /* Main Workspace: Very Slim Side Columns + Maximized Tableau */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(102px, 122px) 1fr minmax(102px, 122px);
      gap: 5px;
      align-items: stretch;
      min-height: 0;
    }

    .side-column {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      background: var(--bg-panel);
      border: 1.5px solid var(--border-vintage);
      border-radius: 10px;
      padding: 6px 5px;
      box-shadow: var(--shadow-soft);
    }

    .label-card {
      position: relative;
      background: #fffdf8;
      border: 1.5px solid #bfa986;
      border-radius: 7px;
      padding: 6px 4px;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(0.72rem, 0.86vw, 0.83rem);
      line-height: 1.15;
      font-weight: 700;
      color: var(--ink-dark);
      cursor: pointer;
      box-shadow: 0 2px 0 #d5c4a7;
      transition: transform 0.14s, border-color 0.14s, background 0.14s, box-shadow 0.14s;
      touch-action: none;
    }

    .label-card:hover:not(.found) {
      border-color: var(--accent-blue);
      transform: translateY(-1px);
    }

    .label-card.active {
      background: #e6f2fa;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px rgba(45, 95, 126, 0.25), 0 2.5px 0 var(--accent-blue);
      color: #153c54;
      transform: scale(1.03);
    }

    .label-card.found {
      background: #e8f5ec;
      border-color: var(--accent-green);
      color: #1f5e39;
      box-shadow: none;
      cursor: default;
      opacity: 0.9;
      padding-right: 17px;
    }

    .label-card.found::after {
      content: "✓";
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      font-weight: 900;
      color: var(--accent-green);
    }

    /* Maximized Tableau Container */
    .tableau-wrap {
      position: relative;
      background: #fffdf7;
      border: 2px solid #9e8766;
      border-radius: 12px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 400px;
    }

    .tableau-wrap.shake {
      animation: shakeBoard 0.36s ease;
    }

    @keyframes shakeBoard {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    svg#city-svg {
      width: 100%;
      height: 100%;
      max-height: calc(100dvh - 80px);
      display: block;
      cursor: crosshair;
      touch-action: manipulation;
    }

    /* Interactive target hover feedback */
    .city-target, .city-distractor {
      cursor: pointer;
    }

    .city-target .hit-area,
    .city-distractor .hit-area {
      fill: transparent;
      stroke: transparent;
    }

    .city-target:hover .target-highlight,
    .city-distractor:hover .target-highlight {
      filter: drop-shadow(0 0 6px rgba(212, 148, 36, 0.55));
    }

    .city-target.found-glow .target-highlight {
      filter: drop-shadow(0 0 6px rgba(46, 125, 79, 0.45));
    }

    /* Placed map pins */
    .map-pin {
      pointer-events: none;
      animation: popPin 0.35s cubic-bezier(0.22, 1.35, 0.55, 1) forwards;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes popPin {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Click feedback ripple */
    .click-feedback {
      position: absolute;
      pointer-events: none;
      width: 44px;
      height: 44px;
      margin-left: -22px;
      margin-top: -22px;
      border-radius: 50%;
      border: 4px solid var(--accent-red);
      background: rgba(185, 56, 44, 0.18);
      animation: rippleOut 0.55s ease-out forwards;
      z-index: 20;
    }

    .click-feedback.ok {
      border-color: var(--accent-green);
      background: rgba(46, 125, 79, 0.2);
    }

    @keyframes rippleOut {
      0% { transform: scale(0.4); opacity: 1; }
      100% { transform: scale(1.65); opacity: 0; }
    }

    /* Slim Info Banner */
    .info-banner {
      background: var(--bg-panel);
      border: 1.5px solid var(--border-vintage);
      border-radius: 8px;
      padding: 4px 10px;
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(0.78rem, 0.96vw, 0.89rem);
      font-weight: 600;
      color: var(--ink-dark);
      box-shadow: 0 2px 6px rgba(43, 33, 24, 0.06);
      transition: background 0.25s, border-color 0.25s;
    }

    .info-banner.success {
      background: #e9f6ee;
      border-color: var(--accent-green);
      color: #195131;
    }

    .info-banner.error {
      background: #fceceb;
      border-color: var(--accent-red);
      color: #7b1e16;
    }

    /* Floating drag ghost */
    .drag-ghost {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      background: #e6f2fa;
      border: 2px solid var(--accent-blue);
      color: #153c54;
      border-radius: 9px;
      padding: 6px 11px;
      font-weight: 800;
      font-size: 0.84rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
      transform: translate(-50%, -50%) scale(1.06);
    }

    /* Modal Overlay */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(32, 24, 16, 0.62);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 500;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: var(--bg-panel);
      border: 3px solid #9e8766;
      border-radius: 18px;
      max-width: 480px;
      width: 100%;
      padding: 24px 22px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-emoji {
      font-size: 2.8rem;
      margin-bottom: 6px;
    }

    .modal-card h2 {
      margin: 0 0 10px;
      font-family: Georgia, serif;
      font-size: 1.48rem;
    }

    .modal-card p {
      margin: 0 0 18px;
      color: var(--ink-muted);
      line-height: 1.5;
      font-size: 0.98rem;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary {
      appearance: none;
      border: none;
      background: var(--accent-blue);
      color: #fff;
      font-weight: 700;
      font-size: 0.98rem;
      padding: 11px 20px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 0 #1c4158;
    }

    .btn-primary:hover {
      background: #24506b;
    }

    .btn-secondary {
      appearance: none;
      border: 2px solid var(--border-vintage);
      background: #fff;
      color: var(--ink-dark);
      font-weight: 700;
      font-size: 0.98rem;
      padding: 9px 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    /* Portrait tablet fallback */
    @media (max-width: 820px) {
      .workspace {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
      }

      .tableau-wrap {
        grid-column: 1 / -1;
        grid-row: 1;
      }

      #left-labels {
        grid-column: 1;
        grid-row: 2;
      }

      #right-labels {
        grid-column: 2;
        grid-row: 2;
      }

      svg#city-svg {
        max-height: 68dvh;
      }

      .label-card {
        padding: 6px 5px;
        min-height: 32px;
        font-size: 0.76rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Compact Top Header & Status Bar -->
    <header class="topbar">
      <div class="title-block">
        <h1>A 20. század eleji fejlődő város</h1>
        <span class="subtitle">Válassz egy címkét oldalt, majd kattints a helyére a tablón!</span>
      </div>

      <div class="hud">
        <div class="active-prompt" id="active-prompt">
          Keresendő: <span class="target-name" id="active-target-name">Villamos</span>
        </div>

        <div class="lives-box" aria-label="Hátralévő életek">
          <span>Életek:</span>
          <div class="hearts" id="hearts-container">
            <svg class="heart" viewBox="0 0 24 24" fill="#c9362b"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <svg class="heart" viewBox="0 0 24 24" fill="#c9362b"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <svg class="heart" viewBox="0 0 24 24" fill="#c9362b"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </div>
        </div>

        <div class="progress-pill" id="progress-pill">0 / 10 kész</div>

        <button class="btn-icon" id="sound-btn" title="Hang ki/be">🔊 Hang</button>
        <button class="btn-icon" id="restart-btn" title="Újrakezdés">↻ Újra</button>
      </div>
    </header>

    <!-- Main 2-Sided Label + Maximized Center Tableau -->
    <main class="workspace">
      <aside class="side-column" id="left-labels" aria-label="Bal oldali címkék"></aside>

      <section class="tableau-wrap" id="tableau-wrap">
        <!-- Tighter viewBox (0 44 1320 634) enlarges the city artwork cleanly -->
        <svg id="city-svg" viewBox="0 44 1320 634" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="20. század eleji fejlődő város tablókép">
          <defs>
            <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c6deec"/>
              <stop offset="65%" stop-color="#e9f1f0"/>
              <stop offset="100%" stop-color="#f6ebd6"/>
            </linearGradient>
            <linearGradient id="soilGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#6b4e38"/>
              <stop offset="100%" stop-color="#473222"/>
            </linearGradient>
            <linearGradient id="waterGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#4e8999"/>
              <stop offset="50%" stop-color="#65a6b7"/>
              <stop offset="100%" stop-color="#4e8999"/>
            </linearGradient>
            <pattern id="cobblePattern" width="24" height="14" patternUnits="userSpaceOnUse">
              <rect width="24" height="14" fill="#8f8578"/>
              <rect x="1" y="1" width="10" height="5" rx="2" fill="#a29789"/>
              <rect x="13" y="1" width="10" height="5" rx="2" fill="#9a8f81"/>
              <rect x="7" y="8" width="10" height="5" rx="2" fill="#a79c8d"/>
              <rect x="-5" y="8" width="10" height="5" rx="2" fill="#998e80"/>
              <rect x="19" y="8" width="10" height="5" rx="2" fill="#998e80"/>
            </pattern>
            <pattern id="brickPattern" width="20" height="12" patternUnits="userSpaceOnUse">
              <rect width="20" height="12" fill="#8f4533"/>
              <rect x="1" y="1" width="8" height="4" fill="#a55440"/>
              <rect x="11" y="1" width="8" height="4" fill="#9d4d3a"/>
              <rect x="6" y="7" width="8" height="4" fill="#a85642"/>
              <rect x="-4" y="7" width="8" height="4" fill="#994b38"/>
              <rect x="16" y="7" width="8" height="4" fill="#994b38"/>
            </pattern>
          </defs>

          <!-- Background Sky & Distant City Silhouette -->
          <g id="background-layer">
            <rect x="0" y="40" width="1320" height="390" fill="url(#skyGrad)"/>
            <circle cx="165" cy="74" r="22" fill="#fdf1cb" opacity="0.82"/>
            <g fill="#ffffff" opacity="0.72">
              <ellipse cx="360" cy="72" rx="46" ry="13"/>
              <ellipse cx="390" cy="66" rx="28" ry="11"/>
              <ellipse cx="810" cy="76" rx="54" ry="14"/>
              <ellipse cx="845" cy="69" rx="32" ry="11"/>
              <ellipse cx="1145" cy="68" rx="40" ry="12"/>
            </g>

            <!-- Distant Skyline Silhouette -->
            <g fill="#cbd3d6" opacity="0.65">
              <rect x="190" y="265" width="44" height="155"/>
              <polygon points="354,268 368,212 382,268"/>
              <rect x="505" y="255" width="45" height="165"/>
              <rect x="680" y="248" width="42" height="172"/>
              <rect x="830" y="262" width="44" height="158"/>
              <rect x="995" y="255" width="40" height="165"/>
            </g>

            <!-- Sidewalk & Boulevard Base -->
            <rect x="0" y="408" width="1320" height="32" fill="#d9ceb8"/>
            <line x1="0" y1="408" x2="1320" y2="408" stroke="#b3a48b" stroke-width="2"/>
            <rect x="0" y="438" width="1320" height="5" fill="#9b8d77"/>

            <!-- Roadway Cobblestones -->
            <rect x="0" y="443" width="1320" height="97" fill="url(#cobblePattern)"/>

            <!-- Railway Track Bed on Left (for Steam Locomotive) -->
            <rect x="0" y="438" width="252" height="22" fill="#70665b"/>
            <g fill="#4d3624">
              <rect x="8" y="440" width="8" height="19"/><rect x="26" y="440" width="8" height="19"/>
              <rect x="44" y="440" width="8" height="19"/><rect x="62" y="440" width="8" height="19"/>
              <rect x="80" y="440" width="8" height="19"/><rect x="98" y="440" width="8" height="19"/>
              <rect x="116" y="440" width="8" height="19"/><rect x="134" y="440" width="8" height="19"/>
              <rect x="152" y="440" width="8" height="19"/><rect x="170" y="440" width="8" height="19"/>
              <rect x="188" y="440" width="8" height="19"/><rect x="206" y="440" width="8" height="19"/>
              <rect x="224" y="440" width="8" height="19"/><rect x="242" y="440" width="8" height="19"/>
            </g>
            <line x1="0" y1="444" x2="252" y2="444" stroke="#2c3034" stroke-width="3"/>
            <line x1="0" y1="455" x2="252" y2="455" stroke="#2c3034" stroke-width="3"/>
            <path d="M244,458 L252,438 L258,438 L258,458 Z" fill="#9c2e25" stroke="#222" stroke-width="1.5"/>

            <!-- Street Tram Rails -->
            <line x1="258" y1="472" x2="1320" y2="472" stroke="#5d574f" stroke-width="2.5"/>
            <line x1="258" y1="480" x2="1320" y2="480" stroke="#5d574f" stroke-width="2.5"/>
            <line x1="0" y1="518" x2="1320" y2="518" stroke="#514b43" stroke-width="3"/>
            <line x1="0" y1="526" x2="1320" y2="526" stroke="#514b43" stroke-width="3"/>

            <!-- Decorative Trees, Lamps & Period Pedestrians -->
            <g id="street-decor">
              <rect x="370" y="370" width="5" height="39" fill="#6b4b32"/>
              <circle cx="372" cy="356" r="17" fill="#6f9259"/>
              <rect x="696" y="368" width="5" height="41" fill="#6b4b32"/>
              <circle cx="698" cy="353" r="18" fill="#6f9259"/>
              <rect x="1012" y="370" width="5" height="39" fill="#6b4b32"/>
              <circle cx="1014" cy="356" r="17" fill="#6f9259"/>

              <g transform="translate(508,404)">
                <circle cx="0" cy="0" r="3.8" fill="#e6be9a"/>
                <rect x="-4" y="-6" width="8" height="3" fill="#2b2118"/>
                <rect x="-6" y="-3" width="12" height="1.5" fill="#2b2118"/>
                <path d="M-4,4 L4,4 L5,21 L-5,21 Z" fill="#3a332e"/>
                <rect x="-3" y="21" width="2.2" height="9" fill="#2b2118"/>
                <rect x="1" y="21" width="2.2" height="9" fill="#2b2118"/>
              </g>
              <g transform="translate(521,406)">
                <circle cx="0" cy="0" r="3.6" fill="#e6be9a"/>
                <ellipse cx="0" cy="-4" rx="7" ry="2" fill="#7a4c58"/>
                <path d="M-4,4 L4,4 L7,26 L-7,26 Z" fill="#6a495c"/>
              </g>
              <g transform="translate(866,405)">
                <circle cx="0" cy="0" r="3.8" fill="#e6be9a"/>
                <rect x="-5" y="-4" width="10" height="2" fill="#222"/>
                <rect x="-3.5" y="-8" width="7" height="4" fill="#222"/>
                <path d="M-4,4 L4,4 L5,21 L-5,21 Z" fill="#46525c"/>
                <rect x="-3" y="21" width="2.2" height="9" fill="#222"/>
                <rect x="1" y="21" width="2.2" height="9" fill="#222"/>

      function playTone(type) {
        if (!soundEnabled) return;
        try {
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            audioCtx = new Ctx();
          }
          if (audioCtx.state === "suspended") audioCtx.resume();
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);

          if (type === "ok") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.08);
            osc.frequency.setValueAtTime(783.99, now + 0.16);
            gain.gain.setValueAtTime(0.16, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
            osc.start(now);
            osc.stop(now + 0.36);
          } else if (type === "err") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(210, now);
            osc.frequency.linearRampToValueAtTime(140, now + 0.22);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
            osc.start(now);
            osc.stop(now + 0.26);
          } else if (type === "win") {
            osc.type = "triangle";
            [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
              osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            });
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
            osc.start(now);
            osc.stop(now + 0.55);
          }
        } catch (e) {}
      }

          card.className = "label-card";
          card.dataset.id = item.id;
          card.textContent = item.name;
          card.setAttribute("role", "button");
          card.setAttribute("tabindex", "0");

          setupCardPointerEvents(card, item);

          card.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              selectLabel(item.id);
            }
          });

          if (item.side === "left") {
            leftCol.appendChild(card);
          } else {
            rightCol.appendChild(card);
          }
        });
      }

      function setupCardPointerEvents(card, item) {
        let startX = 0;
        let startY = 0;
        let isDragging = false;
        let ghost = null;

        card.addEventListener("pointerdown", (e) => {
          if (gameOver || foundIds.has(item.id)) return;
          startX = e.clientX;
          startY = e.clientY;
          isDragging = false;
          card.setPointerCapture(e.pointerId);
        });

        card.addEventListener("pointermove", (e) => {
          if (!card.hasPointerCapture(e.pointerId)) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          if (!isDragging && Math.hypot(dx, dy) > 10) {
            isDragging = true;
            selectLabel(item.id);
            ghost = document.createElement("div");
            ghost.className = "drag-ghost";
            ghost.textContent = item.name;
            document.body.appendChild(ghost);
          }
          if (isDragging && ghost) {
            ghost.style.left = e.clientX + "px";
            ghost.style.top = e.clientY + "px";
          }
        });

        card.addEventListener("pointerup", (e) => {
          if (card.hasPointerCapture(e.pointerId)) {
            card.releasePointerCapture(e.pointerId);
          }
          if (isDragging) {
            if (ghost) {
              ghost.remove();
              ghost = null;
            }
            const dropEl = document.elementFromPoint(e.clientX, e.clientY);
            const targetGroup = dropEl ? dropEl.closest(".city-target") : null;
            const distractorGroup = dropEl ? dropEl.closest(".city-distractor") : null;
            const inSvg = dropEl && citySvg.contains(dropEl);
            if (inSvg) {
              handleBoardAttempt(
                targetGroup ? targetGroup.dataset.id : null,
                distractorGroup ? distractorGroup.dataset.distractor : null,
                e.clientX,
                e.clientY,
                item.id
              );
            }
          } else {
            if (!foundIds.has(item.id) && !gameOver) {
              selectLabel(item.id);
            }
          }
          isDragging = false;
        });

        card.addEventListener("pointercancel", () => {
          if (ghost) {
            ghost.remove();
            ghost = null;
          }
          isDragging = false;
        });
      }

      function selectLabel(id) {
        if (foundIds.has(id) || gameOver) return;
        activeId = id;
        updateUI();
      }

      function getNextUnfoundId() {
        const next = ITEMS.find((item) => !foundIds.has(item.id));
        return next ? next.id : null;
      }

      function updateUI() {
        const cards = document.querySelectorAll(".label-card");
        cards.forEach((c) => {
          const id = c.dataset.id;
          c.classList.toggle("found", foundIds.has(id));
          c.classList.toggle("active", !gameOver && id === activeId && !foundIds.has(id));
        });

        const activeItem = ITEMS.find((i) => i.id === activeId);
        if (activeItem && !foundIds.has(activeId) && !gameOver) {
          activePromptBox.style.display = "flex";
          activeTargetName.textContent = activeItem.name;
        } else {
          activePromptBox.style.display = "none";
        }

        progressPill.textContent = `${foundIds.size} / ${ITEMS.length} kész`;

        const heartEls = heartsContainer.querySelectorAll(".heart");
        heartEls.forEach((h, idx) => {
          h.classList.toggle("lost", idx >= lives);
        });
      }

      function showClickRipple(clientX, clientY, isOk) {
        const rect = tableauWrap.getBoundingClientRect();
        const ripple = document.createElement("div");
        ripple.className = "click-feedback" + (isOk ? " ok" : "");
        ripple.style.left = (clientX - rect.left) + "px";
        ripple.style.top = (clientY - rect.top) + "px";
        tableauWrap.appendChild(ripple);
        setTimeout(() => ripple.remove(), 580);
      }

      function setBanner(text, type = "") {
        infoBanner.textContent = text;
        infoBanner.className = "info-banner" + (type ? " " + type : "");
      }

      function placeMapPin(item) {
        const ns = "http://www.w3.org/2000/svg";
        const g = document.createElementNS(ns, "g");
        g.setAttribute("class", "map-pin");
        g.setAttribute("data-pin-id", item.id);

        const padX = 11;
        const approxWidth = Math.max(82, item.name.length * 9 + padX * 2);
        const boxH = 26;
        const x = Math.min(Math.max(item.pinX - approxWidth / 2, 10), 1310 - approxWidth);
        const y = Math.min(Math.max(item.pinY - boxH / 2, 52), 670 - boxH);

        const rect = document.createElementNS(ns, "rect");
        rect.setAttribute("x", x);
        rect.setAttribute("y", y);
        rect.setAttribute("width", approxWidth);
        rect.setAttribute("height", boxH);
        rect.setAttribute("rx", "7");
        rect.setAttribute("fill", "#fff9eb");
        rect.setAttribute("stroke", "#2e7d4f");
        rect.setAttribute("stroke-width", "2.2");

        const txt = document.createElementNS(ns, "text");
        txt.setAttribute("x", x + approxWidth / 2);
        txt.setAttribute("y", y + 18);
        txt.setAttribute("text-anchor", "middle");
        txt.setAttribute("font-family", "Segoe UI, sans-serif");
        txt.setAttribute("font-size", "13.5");
        txt.setAttribute("font-weight", "800");
        txt.setAttribute("fill", "#1d4f32");
        txt.textContent = "✓ " + item.name;

        g.appendChild(rect);
        g.appendChild(txt);
        pinsLayer.appendChild(g);

        const targetGroup = citySvg.querySelector(`.city-target[data-id="${item.id}"]`);
        if (targetGroup) targetGroup.classList.add("found-glow");
      }

      function handleBoardAttempt(clickedTargetId, clickedDistractorId, clientX, clientY, overrideItemId = null) {
        if (gameOver) return;

        if (clickedTargetId && foundIds.has(clickedTargetId) && !overrideItemId) {
          const foundItem = ITEMS.find((i) => i.id === clickedTargetId);
          setBanner(`${foundItem.name}: ${foundItem.fact}`, "success");
          return;
        }

        const expectedId = overrideItemId || activeId;
        const expectedItem = ITEMS.find((i) => i.id === expectedId);
        if (!expectedItem) return;

        if (clickedTargetId === expectedId) {
          foundIds.add(expectedId);
          showClickRipple(clientX, clientY, true);
          placeMapPin(expectedItem);
          playTone(foundIds.size === ITEMS.length ? "win" : "ok");
          setBanner(`Helyes! ${expectedItem.name} – ${expectedItem.fact}`, "success");

          if (foundIds.size === ITEMS.length) {
            gameOver = true;
            activeId = null;
            updateUI();
            setTimeout(() => showEndModal(true), 450);
          } else {
            activeId = getNextUnfoundId();
            updateUI();
          }
        } else {
          lives = Math.max(0, lives - 1);
          showClickRipple(clientX, clientY, false);
          playTone("err");
          tableauWrap.classList.remove("shake");
          void tableauWrap.offsetWidth;
          tableauWrap.classList.add("shake");

          const clickedItem = ITEMS.find((i) => i.id === clickedTargetId);
          if (clickedItem) {
            setBanner(`Hoppá! Ez a(z) ${clickedItem.name}, nem a(z) ${expectedItem.name}. (-1 élet)`, "error");
          } else if (clickedDistractorId && DISTRACTORS[clickedDistractorId]) {
            setBanner(`Hoppá! Ez egy ${DISTRACTORS[clickedDistractorId]}, nem a(z) ${expectedItem.name}. (-1 élet)`, "error");
          } else {
            setBanner(`Hoppá! Itt nem található a(z) ${expectedItem.name}. (-1 élet)`, "error");
          }

          updateUI();

          if (lives <= 0) {
            gameOver = true;
            updateUI();
            setTimeout(() => showEndModal(false), 450);
          }
        }
      }

      function showEndModal(won) {
        if (won) {
          modalEmoji.textContent = "🏆";
          modalTitle.textContent = "Nagyszerű munka!";
          modalMessage.textContent = `Mind a 10 elemet sikeresen felcímkézted a 20. század eleji város tablóján (${lives} megmaradt élettel). Kattints bármelyik címkére a magyarázat felidézéséhez!`;
          modalRevealBtn.textContent = "Tabló megtekintése";
        } else {
          modalEmoji.textContent = "💔";
          modalTitle.textContent = "Elfogyott a 3 életed!";
          modalMessage.textContent = `Eddig ${foundIds.size} elemet találtál meg a 10-ből. Próbáld meg újra, vagy nézd meg a teljes megoldást a közös megbeszéléshez!`;
          modalRevealBtn.textContent = "Megoldás megtekintése";
        }
        endModal.classList.add("open");
      }

      function revealAllSolution() {
        endModal.classList.remove("open");
        gameOver = true;
        ITEMS.forEach((item) => {
          if (!foundIds.has(item.id)) {
            foundIds.add(item.id);
            placeMapPin(item);
          }
        });
        updateUI();
        setBanner("A teljes megoldás látható. Kattints bármelyik városi elemre a történelmi magyarázatért!", "success");
      }

      function resetGame() {
        endModal.classList.remove("open");
        lives = MAX_LIVES;
        foundIds.clear();
        activeId = ITEMS[0].id;
        gameOver = false;
        pinsLayer.innerHTML = "";
        document.querySelectorAll(".city-target").forEach((el) => el.classList.remove("found-glow"));
        setBanner("Keresd meg a 20. század eleji fejlődő város 10 újszerű elemét a tablón!");
        updateUI();
      }

      citySvg.addEventListener("click", (e) => {
        const targetGroup = e.target.closest(".city-target");
        const distractorGroup = e.target.closest(".city-distractor");
        const clickedId = targetGroup ? targetGroup.dataset.id : null;
        const distractorId = distractorGroup ? distractorGroup.dataset.distractor : null;

        if (gameOver && clickedId) {
          const item = ITEMS.find((i) => i.id === clickedId);
          if (item && foundIds.has(item.id)) {
            setBanner(`${item.name}: ${item.fact}`, "success");
          }
          return;
        }

        handleBoardAttempt(clickedId, distractorId, e.clientX, e.clientY);
      });

      soundBtn.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? "🔊 Hang" : "🔇 Némítva";
      });

      restartBtn.addEventListener("click", resetGame);
      modalRestartBtn.addEventListener("click", resetGame);
      modalRevealBtn.addEventListener("click", revealAllSolution);

      buildLabelCards();
      updateUI();
    })();
  </script>
</body>
</html>
